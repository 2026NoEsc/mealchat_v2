name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality and security gates (UTC)
        run: npm run quality
        env:
          TZ: UTC

      - name: Run Jest tests (Asia/Seoul)
        run: npm test -- --ci --runInBand
        env:
          TZ: Asia/Seoul

      - name: Run Jest tests (America/Los_Angeles)
        run: npm test -- --ci --runInBand
        env:
          TZ: America/Los_Angeles
